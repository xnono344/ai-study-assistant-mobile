<!DOCTYPE html>
<html>
<head>
<title>Nexus Study - Mobile Preview</title>
<style>

  h1 { color: #FFD700; font-size: 24px; text-align: center; margin-top: 50px; font-family: 'NexusDisplay', sans-serif; }
  p { color: #999; text-align: center; margin-top: 20px; padding: 0 20px; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <iframe src="/expo-router/entry.bundle?platform=ios&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.bytecode=1&transform.routerRoot=app&unstable_transformProfile=hermes-stable" sandbox="allow-scripts allow-same-origin"></iframe>
</div>
</body>
</html>
